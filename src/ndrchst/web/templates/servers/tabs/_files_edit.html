<div id="files-shell">
  <div class="crumbs">
    <a href="#" hx-get="/servers/{{ server.id }}/files?path={{ parent }}" hx-target="#files-shell" hx-swap="outerHTML">← back</a>
    <span style="margin-left: 0.5rem;">{{ path }}</span>
  </div>
  <form hx-post="/servers/{{ server.id }}/files/edit?path={{ path }}"
        hx-target="#files-shell" hx-swap="outerHTML">
    <textarea name="content" rows="20"
              style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border);
                     border-radius: var(--radius-sm); color: var(--text-primary); padding: 0.75rem;
                     font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">{{ content }}</textarea>
    <div style="margin-top: 0.5rem; display: flex; gap: 0.4rem;">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-ghost"
              hx-get="/servers/{{ server.id }}/files?path={{ parent }}"
              hx-target="#files-shell" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</div>
