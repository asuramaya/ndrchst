<form class="props-form"
      hx-post="/servers/{{ server.id }}/properties"
      hx-target="#props-result"
      hx-swap="innerHTML">
  {% if not properties %}
    <div class="empty">No <code>server.properties</code> yet. Start the server once to generate defaults.</div>
  {% else %}
    {% for key, value in properties.items() %}
      <div class="prop-row">
        <label for="prop-{{ key }}">{{ key }}</label>
        <input id="prop-{{ key }}" name="{{ key }}" value="{{ value }}">
      </div>
    {% endfor %}
    <div style="margin-top: 0.75rem; display: flex; gap: 0.5rem;">
      <button type="submit" class="btn btn-primary">Save (restart required)</button>
      <div id="props-result" style="color: var(--text-muted); font-size: 0.85rem;"></div>
    </div>
  {% endif %}
</form>
