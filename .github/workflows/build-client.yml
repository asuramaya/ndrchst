name: build-client

# Cross-platform single-file client launcher builds. PyInstaller can't
# cross-compile, so we run it on each OS runner and upload the artifact.
# Players download the binary for their OS — no Python required on their
# machine.

on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"
    paths:
      - "client/**"
      - ".github/workflows/build-client.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ndrchst-client-linux-x86_64
            bin: ndrchst-client
          - os: windows-latest
            asset: ndrchst-client-windows-x86_64.exe
            bin: ndrchst-client.exe
          - os: macos-latest
            asset: ndrchst-client-macos-arm64
            bin: ndrchst-client
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller portablemc httpx

      # Stamp the binary's __version__ from the tag (client-vX.Y.Z → X.Y.Z) so
      # the self-updater compares against the version it actually shipped as.
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/client-v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#client-v}"
          sed -i.bak "s/__version__ = \"[^\"]*\"/__version__ = \"$V\"/" src/ndrchst_client/__init__.py
          rm -f src/ndrchst_client/__init__.py.bak
          echo "stamped version $V"

      - name: Build
        run: pyinstaller ndrchst-client.spec

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: client/out/${{ matrix.asset }}
          if-no-files-found: error

  # Publish the built binaries + an update manifest to Cloudflare R2 so
  # clients self-update from a global CDN, not the operator's host.
  # Opt-in: set repo variable PUBLISH_R2=true and the R2_* secrets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/client-v') && vars.PUBLISH_R2 == 'true'
    env:
      R2_PREFIX: ${{ vars.R2_PREFIX || 'client' }}
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Assemble release + manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#client-v}"
          mkdir -p release
          # download-artifact nests each under <name>/<name>; flatten.
          for f in ndrchst-client-linux-x86_64 ndrchst-client-windows-x86_64.exe ndrchst-client-macos-arm64; do
            cp "dl/$f/$f" "release/$f"
          done
          sha() { sha256sum "release/$1" | cut -d' ' -f1; }
          cat > release/latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "ndrchst client ${VERSION}",
            "assets": {
              "linux-x86_64":   {"file": "ndrchst-client-linux-x86_64",       "sha256": "$(sha ndrchst-client-linux-x86_64)"},
              "windows-x86_64": {"file": "ndrchst-client-windows-x86_64.exe",  "sha256": "$(sha ndrchst-client-windows-x86_64.exe)"},
              "macos-arm64":    {"file": "ndrchst-client-macos-arm64",         "sha256": "$(sha ndrchst-client-macos-arm64)"}
            }
          }
          JSON
          echo "--- latest.json ---"; cat release/latest.json

      - name: Upload to R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          # Binaries are immutable per version → cache hard. The manifest
          # must always be fresh → no-cache so clients see new releases.
          for f in ndrchst-client-linux-x86_64 ndrchst-client-windows-x86_64.exe ndrchst-client-macos-arm64; do
            aws s3 cp "release/$f" "s3://${R2_BUCKET}/${R2_PREFIX}/$f" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/octet-stream \
              --cache-control "public, max-age=31536000, immutable"
          done
          aws s3 cp release/latest.json "s3://${R2_BUCKET}/${R2_PREFIX}/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "no-cache"
          echo "Published ${GITHUB_REF_NAME} to r2://${R2_BUCKET}/${R2_PREFIX}/"
