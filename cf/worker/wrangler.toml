# Cloudflare Worker that serves the ndrchst client-distribution surface from R2.
#
# The whole surface lives on ONE host — play.ndrchst.com — and is fully static:
#   play.ndrchst.com/      → index.html (landing)  /play → play.html (app)
#   play.ndrchst.com/client/<sid>/*  → R2 artifacts (config, client.zip, mods)
#   play.ndrchst.com/client/latest.json + binaries  → client self-update
#   play.ndrchst.com/servers.json    → server catalog
#   ndrchst.com/* and www.ndrchst.com/*  → 301 to play.ndrchst.com (same path)
# The www/apex routes stay listed below ONLY so the Worker receives that traffic
# and can issue the redirect; they serve no content of their own.
#
# The box publishes index.html / play.html / servers.json / client/<sid>/* into
# the bucket (see src/ndrchst/runtime/publish.py); this Worker maps static URLs
# to R2 keys. Deploy: `wrangler deploy` (from this dir).
#
# Top-level keys (incl. `routes`) MUST come before the [[r2_buckets]] table —
# TOML otherwise parses them as fields of that table.

name = "ndrchst-edge"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Public hostnames. Requires the zone `ndrchst.com` on this Cloudflare account.
# The per-server artifacts are in R2 (light publish); the big modpack.zip is
# intentionally NOT in R2 — the client pulls the pack from CurseForge's CDN
# (see Lifecycle.modpack_cdn_url).
#
# Until ready, comment these routes out: `wrangler deploy` then lands only on
# the workers.dev URL for a no-cutover validation deploy.
routes = [
  { pattern = "play.ndrchst.com/*", zone_name = "ndrchst.com" },
  { pattern = "www.ndrchst.com/*", zone_name = "ndrchst.com" },
  { pattern = "ndrchst.com/*", zone_name = "ndrchst.com" },
]

[[r2_buckets]]
binding = "DL"
bucket_name = "ndrchst-dl"
