# Cloudflare Worker that serves the ndrchst public surface from R2.
#
#   play.ndrchst.com/*  → play page + /pilot/<sid>/* artifacts (from R2)
#   www.ndrchst.com/*   → marketing landing
#
# The box publishes index.html / play.html / servers.json / pilot/<sid>/*
# into the bucket (see src/ndrchst/runtime/publish.py); this Worker just
# maps URLs to R2 keys. Deploy: `wrangler deploy` (from this dir).
#
# Top-level keys (incl. `routes`) MUST come before the [[r2_buckets]] table —
# TOML otherwise parses them as fields of that table.

name = "ndrchst-edge"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Public hostnames. Requires the zone `ndrchst.com` on this Cloudflare account.
# CUT OVER ONLY AFTER modpack.zip is published to R2 — a premature cutover
# would 404 client first-installs. Until then, `wrangler deploy` lands on the
# workers.dev URL; comment these out for a no-cutover validation deploy.
routes = [
  { pattern = "play.ndrchst.com/*", zone_name = "ndrchst.com" },
  { pattern = "www.ndrchst.com/*", zone_name = "ndrchst.com" },
]

[[r2_buckets]]
binding = "DL"
bucket_name = "ndrchst-dl"
