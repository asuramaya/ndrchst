name: ndrchst
version: 0.2.0
main: com.ndrchst.paper.NdrchstPaperPlugin
api-version: '1.21'
authors: [ndrchst]
description: Wallet-gated tiers for the cross-play (Paper) path — shares the box + core with the modded server.
commands:
  link:
    description: Link your wallet to unlock your $NDRCHST tier.
    usage: /link
  tier:
    description: Show your $NDRCHST standing.
    usage: /tier
  price:
    description: Show the $NDRCHST ticker.
    usage: /price
  fly:
    description: Toggle flight (Gold+ perk).
    usage: /fly
  hat:
    description: Wear your held item as a hat (Silver+ perk).
    usage: /hat
permissions:
  ndrchst.perk.fly:
    description: Creative flight via /fly (granted to gold+).
    default: false
  ndrchst.perk.hat:
    description: Wear held item as a hat via /hat (granted to silver+).
    default: false
