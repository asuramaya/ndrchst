plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Shared platform-neutral core (../core), compiled straight into this mod jar.
// The SAME sources are compiled into the Paper plugin — one source of truth for
// the box client + tier model, no jar-in-jar, no published artifact. Core is
// Minecraft-free so it compiles fine inside the NeoForge build's classpath.
sourceSets.main.java.srcDir "${projectDir}/../core/src/main/java"

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    // Throwaway dedicated server for load-testing the mod in isolation
    // (catches ModLoadingException / wrong-bus errors before we ever touch the
    // live ATM10 server). `gradle runServer` boots it with just this mod.
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expand ${...} placeholders in the mods.toml template at build time so the
// versions live only in gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
