[project]
name = "ndrchst-client"
version = "0.0.1"
description = "Offline Minecraft client for ndrchst private-server clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["portablemc>=4.4"]

[project.scripts]
ndrchst-client = "ndrchst_client.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
